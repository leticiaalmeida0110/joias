
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ titulo }}</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            color: #263238;
            margin: 0;
        }

        header {
            background: #174a35;
            color: white;
            padding: 25px;
            text-align: center;
        }

        main {
            max-width: 800px;
            margin: 35px auto;
            padding: 25px;
            background: white;
            border-radius: 8px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-top: 5px;
        }

        input[type="checkbox"] {
            width: auto;
        }

        form p {
            margin-bottom: 20px;
        }

        button {
            background: #198754;
            color: white;
            padding: 12px 22px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #146c43;
        }

        .cancelar {
            color: #174a35;
            margin-left: 15px;
            font-weight: bold;
        }

        .erro {
            color: #c62828;
        }

        a.voltar {
            color: #174a35;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <h1>{{ titulo }}</h1>
</header>

<main>

    <a class="voltar" href="javascript:history.back()">
        Voltar
    </a>

    <h2>Preencha os dados</h2>

    <form method="POST">
        {% csrf_token %}

        {% if form.non_field_errors %}
            <div class="erro">
                {{ form.non_field_errors }}
            </div>
        {% endif %}

        {{ form.as_p }}

        <button type="submit">Salvar</button>

        <a class="cancelar" href="javascript:history.back()">
            Cancelar
        </a>
    </form>

</main>

</body>
</html>
