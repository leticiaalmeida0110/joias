
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Itens de Venda/title>
</head>
<body style="font-family: Arial; background: #f2f5f9;">
<header style="background: #174a35; color: white; padding: 25px; text-align: center;">
    <h1>Itens de Venda</h1>
</header>
<main style="margin: 35px;">
    <a href="/">Voltar ao menu principal</a>
    <h2>Lista de Itens de Venda</h2>
    <table width="100%" border="1" cellpadding="12" style="background: white; border-collapse: collapse;">
        <tr style="background: #174a35; color: white;">
            <th>Venda</th><th>Produto</th>
            <th>Quantidade</th><th>Valor Unitário</th>
        </tr>
        {% for item in dados %}
        <tr>
            <td>{{ item.venda }}</td>
            <td>{{ item.produto }}</td>
            <td>{{ item.quantidade }}</td>
            <td>R$ {{ item.valor_unitario }}</td>
        </tr>
        {% empty %}
        <tr><td colspan="4">Nenhum item de venda cadastrado.</td></tr>
        {% endfor %}
    </table>
</main>
</body>
</html>
